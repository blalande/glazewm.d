<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Custom styles. -->
    <link rel="stylesheet" type="text/css" href="./styles.css" />

    <!-- Allows React to be run buildless via "text/babel" script below. -->
    <script
      src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"
      integrity="sha256-aS0B0wnsaDByLfE16h4MDCP1fQFccysd1YWOcV+gbBo="
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
      import React, {
        useState,
        useEffect,
        useRef,
      } from 'https://esm.sh/react@18?dev';
      import { createRoot } from 'https://esm.sh/react-dom@18/client?dev';
      import * as zebar from 'https://esm.sh/zebar@3.0';
      import { currentMonitor as getCurrentMonitor } from 'https://esm.sh/@tauri-apps/api@2.0.2/window';

      const providers = zebar.createProviderGroup({
        network: { type: 'network' },
        cpu: { type: 'cpu' },
        date: { type: 'date', formatting: 'EEE d MMM t' },
        battery: { type: 'battery' },
        memory: { type: 'memory' },
        weather: { type: 'weather' },
      });

      createRoot(document.getElementById('root')).render(<App />);

      // Human-readable names for GlazeWM layouts.
      const LAYOUT_NAMES = {
        master_stack: 'Master/stack',
        columns: 'Columns',
        rows: 'Rows',
        monocle: 'Monocle',
        grid: 'Grid',
        dwindle: 'Dwindle',
      };

      // Queries that rebuild the bar's GlazeWM state.
      const GLAZEWM_QUERIES = [
        'query monitors',
        'query binding-modes',
        'query paused',
      ];

      // Talks to GlazeWM's IPC server directly (Zebar's built-in GlazeWM
      // provider still expects the removed tiling direction query).
      // Re-queries the state on every WM event, coalesced over 50ms, and
      // reconnects every 2s while GlazeWM is not running.
      function useGlazeWm(currentMonitor) {
        const [wm, setWm] = useState(null);
        const socketRef = useRef(null);

        useEffect(() => {
          let socket;
          let retryTimer;
          let refreshTimer;
          let isDisposed = false;

          const refresh = () => {
            clearTimeout(refreshTimer);
            refreshTimer = setTimeout(() => {
              GLAZEWM_QUERIES.forEach(query => socket.send(query));
            }, 50);
          };

          const connect = () => {
            socket = new WebSocket('ws://localhost:6123');
            socketRef.current = socket;

            socket.onopen = () => {
              GLAZEWM_QUERIES.forEach(query => socket.send(query));
              socket.send('sub -e all');
            };

            socket.onmessage = event => {
              const message = JSON.parse(event.data);

              if (message.messageType === 'event_subscription') {
                refresh();
                return;
              }

              if (!message.success) {
                console.error(
                  `GlazeWM: ${message.clientMessage}: ${message.error}`,
                );
                return;
              }

              switch (message.clientMessage) {
                case 'query monitors':
                  setWm(wm => ({ ...wm, monitors: message.data.monitors }));
                  break;
                case 'query binding-modes':
                  setWm(wm => ({
                    ...wm,
                    bindingModes: message.data.bindingModes,
                  }));
                  break;
                case 'query paused':
                  setWm(wm => ({ ...wm, isPaused: message.data }));
                  break;
              }
            };

            socket.onclose = () => {
              setWm(null);
              if (!isDisposed) retryTimer = setTimeout(connect, 2000);
            };
          };

          connect();

          return () => {
            isDisposed = true;
            clearTimeout(retryTimer);
            clearTimeout(refreshTimer);
            socket?.close();
          };
        }, []);

        if (!wm?.monitors || !currentMonitor) return null;

        // Pick the GlazeWM monitor closest to the one showing this bar,
        // the same way Zebar's built-in provider does.
        const distance = monitor =>
          Math.hypot(
            monitor.x - currentMonitor.x,
            monitor.y - currentMonitor.y,
          );
        const monitor = wm.monitors.reduce((closest, candidate) =>
          distance(candidate) < distance(closest) ? candidate : closest,
        );
        const displayedWorkspace = monitor.children.find(
          workspace => workspace.isDisplayed,
        );

        return {
          currentWorkspaces: monitor.children,
          displayedWorkspace,
          bindingModes: wm.bindingModes ?? [],
          isPaused: wm.isPaused ?? false,
          runCommand: (command, subjectId) =>
            socketRef.current?.send(
              subjectId
                ? `command --id ${subjectId} ${command}`
                : `command ${command}`,
            ),
        };
      }

      function App() {
        const [output, setOutput] = useState(providers.outputMap);

        useEffect(() => {
          providers.onOutput(() => setOutput(providers.outputMap));
        }, []);

        // Physical position of the monitor showing this bar.
        const [barMonitor, setBarMonitor] = useState(null);

        useEffect(() => {
          getCurrentMonitor().then(monitor =>
            setBarMonitor(monitor && monitor.position),
          );
        }, []);

        const glazewm = useGlazeWm(barMonitor);

        // Get icon to show for current network status.
        function getNetworkIcon(networkOutput) {
          switch (networkOutput.defaultInterface?.type) {
            case 'ethernet':
              return <i className="nf nf-md-ethernet_cable"></i>;
            case 'proprietary_virtual':
              return <i className="nf nf-md-shield_lock_outline"></i>;
            case 'wifi':
              if (networkOutput.defaultGateway?.signalStrength >= 80) {
                return <i className="nf nf-md-wifi_strength_4"></i>;
              } else if (
                networkOutput.defaultGateway?.signalStrength >= 65
              ) {
                return <i className="nf nf-md-wifi_strength_3"></i>;
              } else if (
                networkOutput.defaultGateway?.signalStrength >= 40
              ) {
                return <i className="nf nf-md-wifi_strength_2"></i>;
              } else if (
                networkOutput.defaultGateway?.signalStrength >= 25
              ) {
                return <i className="nf nf-md-wifi_strength_1"></i>;
              } else {
                return <i className="nf nf-md-wifi_strength_outline"></i>;
              }
            default:
              return (
                <i className="nf nf-md-wifi_strength_off_outline"></i>
              );
          }
        }

        // Get icon to show for how much of the battery is charged.
        function getBatteryIcon(batteryOutput) {
          if (batteryOutput.chargePercent > 90)
            return <i className="nf nf-fa-battery_4"></i>;
          if (batteryOutput.chargePercent > 70)
            return <i className="nf nf-fa-battery_3"></i>;
          if (batteryOutput.chargePercent > 40)
            return <i className="nf nf-fa-battery_2"></i>;
          if (batteryOutput.chargePercent > 20)
            return <i className="nf nf-fa-battery_1"></i>;
          return <i className="nf nf-fa-battery_0"></i>;
        }

        // Get icon to show for current weather status.
        function getWeatherIcon(weatherOutput) {
          switch (weatherOutput.status) {
            case 'clear_day':
              return <i className="nf nf-weather-day_sunny"></i>;
            case 'clear_night':
              return <i className="nf nf-weather-night_clear"></i>;
            case 'cloudy_day':
              return <i className="nf nf-weather-day_cloudy"></i>;
            case 'cloudy_night':
              return <i className="nf nf-weather-night_alt_cloudy"></i>;
            case 'light_rain_day':
              return <i className="nf nf-weather-day_sprinkle"></i>;
            case 'light_rain_night':
              return <i className="nf nf-weather-night_alt_sprinkle"></i>;
            case 'heavy_rain_day':
              return <i className="nf nf-weather-day_rain"></i>;
            case 'heavy_rain_night':
              return <i className="nf nf-weather-night_alt_rain"></i>;
            case 'snow_day':
              return <i className="nf nf-weather-day_snow"></i>;
            case 'snow_night':
              return <i className="nf nf-weather-night_alt_snow"></i>;
            case 'thunder_day':
              return <i className="nf nf-weather-day_lightning"></i>;
            case 'thunder_night':
              return <i className="nf nf-weather-night_alt_lightning"></i>;
          }
        }

        return (
          <div className="app">
            <div className="left">
              <i className="logo nf nf-fa-windows"></i>
              {glazewm && (
                <div className="workspaces">
                  {glazewm.currentWorkspaces.map(workspace => (
                    <button
                      className={`workspace ${workspace.hasFocus && 'focused'} ${workspace.isDisplayed && 'displayed'}`}
                      onClick={() =>
                        glazewm.runCommand(
                          `focus --workspace ${workspace.name}`,
                        )
                      }
                      key={workspace.name}
                    >
                      {workspace.displayName ?? workspace.name}
                    </button>
                  ))}
                </div>
              )}
            </div>

            <div className="center">{output.date?.formatted}</div>

            <div className="right">
              {glazewm && (
                <>
                  {glazewm.isPaused && (
                    <button
                      className="paused-button"
                      onClick={() =>
                        glazewm.runCommand('wm-toggle-pause')
                      }
                    >
                      PAUSED
                    </button>
                  )}
                  {glazewm.bindingModes.map(bindingMode => (
                    <button
                      className="binding-mode"
                      key={bindingMode.name}
                      onClick={() =>
                        glazewm.runCommand(
                          `wm-disable-binding-mode --name ${bindingMode.name}`,
                        )
                      }
                    >
                      {bindingMode.displayName ?? bindingMode.name}
                    </button>
                  ))}

                  {glazewm.displayedWorkspace && (
                    <button
                      className="layout"
                      title="Cycle layout"
                      onClick={() =>
                        glazewm.runCommand(
                          'cycle-layout',
                          glazewm.displayedWorkspace.id,
                        )
                      }
                    >
                      {LAYOUT_NAMES[glazewm.displayedWorkspace.layout] ??
                        glazewm.displayedWorkspace.layout}
                      {glazewm.displayedWorkspace.layoutParams?.flip &&
                        ' (flipped)'}
                    </button>
                  )}
                </>
              )}

              {output.network && (
                <div className="network">
                  {getNetworkIcon(output.network)}
                  {output.network.defaultGateway?.ssid}
                </div>
              )}

              {output.memory && (
                <div className="memory">
                  <i className="nf nf-fae-chip"></i>
                  {Math.round(output.memory.usage)}%
                </div>
              )}

              {output.cpu && (
                <div className="cpu">
                  <i className="nf nf-oct-cpu"></i>

                  {/* Change the text color if the CPU usage is high. */}
                  <span
                    className={output.cpu.usage > 85 ? 'high-usage' : ''}
                  >
                    {Math.round(output.cpu.usage)}%
                  </span>
                </div>
              )}

              {output.battery && (
                <div className="battery">
                  {/* Show icon for whether battery is charging. */}
                  {output.battery.isCharging && (
                    <i className="nf nf-md-power_plug charging-icon"></i>
                  )}
                  {getBatteryIcon(output.battery)}
                  {Math.round(output.battery.chargePercent)}%
                </div>
              )}

              {output.weather && (
                <div className="weather">
                  {getWeatherIcon(output.weather)}
                  {Math.round(output.weather.celsiusTemp)}°C
                </div>
              )}
            </div>
          </div>
        );
      }
    </script>
  </body>
</html>
